name: Release artifacts

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Test
        run: |
          go test ./... -race
          go vet ./...
      - name: Build release binaries
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "dist/volnorez-${os}-${arch}" ./cmd/volnorez
          done
          sha256sum dist/volnorez-* > dist/SHA256SUMS
          cp README.md THIRD_PARTY_NOTICES.md dist/
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volnorez-${{ github.ref_name }}
          path: |
            dist/volnorez-darwin-amd64
            dist/volnorez-darwin-arm64
            dist/volnorez-linux-amd64
            dist/volnorez-linux-arm64
            dist/SHA256SUMS
            dist/README.md
            dist/THIRD_PARTY_NOTICES.md
